spring.application.name=shop-backend

server.port=${PORT:8080}

# Database configuration (PostgreSQL)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

#Swagger enable
springdoc.api-docs.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool (Supabase stability settings)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

#Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# HTTP Email API Keys (for Render Cloud deployment)
resend.api.key=${RESEND_API_KEY:}
brevo.api.key=${BREVO_API_KEY:}

#JWT
jwt.auth.app = JasShop
jwt.auth.secret_key = ${JWT_KEY:DefaultSecretKeyForJasShopECommerceApp2026SecureKey!}
jwt.auth.expires_in = 3600

# ImageKit Configuration (image storage)
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}
